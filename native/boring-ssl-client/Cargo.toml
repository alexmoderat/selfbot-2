[package]
name = "twitch-bot-boring-ssl-client"
version = "0.1.0"
edition = "2021"

# Fork von Potat-Industries/rust-boring-ssl-client (selbst Fork von
# gssvv/rust-boring-ssl-client) -- siehe README.md in diesem Verzeichnis.

[lib]
crate-type = ["cdylib"]

[dependencies]
h2 = "0.3.13"
http = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net"] }
boring = "4.19.0"
tokio-boring = "4.19.0"
bytes = "1.1.0"
once_cell = "1"

[dependencies.neon]
version = "0.10"
default-features = false
features = ["channel-api", "napi-6", "promise-api"]
